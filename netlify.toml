	[build]
	  publish = "dist"
	  functions = "functions"

# 用 zisi 打包函数（默认），把 node_modules 一起带上
# cybersource-rest-client 含 winston 等依赖，需要随函数 bundle
[functions]
  node_bundler = "zisi"

# Content APIs: the canonical implementations live in /api (Vercel style).
# Netlify wrappers for them live in netlify/functions/ (see _vercel-adapter.js).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/404"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Phase 4.2: log AI-crawler visits at the edge (HTML pages only).
[[edge_functions]]
  path = "/*"
  function = "ai-crawl-logger"
  excluded_patterns = ["\\.css$", "\\.js$", "\\.map$", "\\.png$", "\\.jpe?g$", "\\.gif$", "\\.svg$", "\\.ico$", "\\.webp$", "\\.woff2?$", "\\.ttf$", "\\.xml$", "\\.txt$", "^/admin/", "^/admin_dist/", "^/api/", "^/\\.netlify/"]

[[headers]]
  for = "/*"
  [headers.values]
	    X-Frame-Options = "DENY"
	    X-Content-Type-Options = "nosniff"
	    Referrer-Policy = "strict-origin-when-cross-origin"
	    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
	    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
	    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://flex.cybersource.com https://testflex.cybersource.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://flex.cybersource.com https://testflex.cybersource.com https://api.cybersource.com https://apitest.cybersource.com https://*.supabase.co wss://*.supabase.co; frame-src https://flex.cybersource.com https://testflex.cybersource.com https://*.cybersource.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.(css|js|png|jpg|jpeg|gif|svg|ico|woff2|ttf)"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"
